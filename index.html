<!DOCTYPE html>
<html lang="en">
<head>

<title>Check-In</title>
<style>
:root{color-scheme:dark;--bg:#0B0E17;--card:#141927;--ink:#F1E9D8;--mute:#A9A595;--line:#2C3345;--acc:#0D5A63;--acc-ink:#F1E9D8;--sel:#7B2D4A;--gold:#B48A2D;--soft:#1E3B34;--good:#0D5A63;--warn:#E08AA6;--alert:#522136;
--p0:#1B2030;--p1:#B48A2D;--p2:#C4703A;--p3:#D05866}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1,h2,.q{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.01em}h1{font-size:1.6rem;margin:4px 0 2px}h2{font-size:1.05rem;margin:0 0 8px}h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 6px}
p{margin:6px 0}.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:600;text-align:center}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.sm.alt{border:1px solid var(--line)}.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:.9rem}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);min-height:44px}
.chip.on{background:var(--sel);color:var(--ink);border-color:var(--gold);font-weight:600}
.chip.num{min-width:44px;padding:10px 0;text-align:center}
input[type=text],input[type=number],input[type=time],textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:76px;resize:vertical}
label.f{display:block;font-weight:600;margin:16px 0 6px}
.fold{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;text-align:left;background:var(--card)}
.fold b{font-weight:600}.fold span{color:var(--mute);font-size:.85rem}
.foldbody{padding:10px 2px 4px}
.tip{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92rem}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:120px;padding:12px 2px 14px;font-size:.82rem;color:var(--mute)}
nav button.on{color:var(--gold);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.check{display:flex;align-items:center;gap:12px;width:100%;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left}
.check:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.check.on .box{background:var(--good);border-color:var(--gold);color:var(--ink)}
svg.body{display:block;margin:6px auto;width:100%;max-width:260px;touch-action:manipulation}
svg.body .r{stroke:var(--line);stroke-width:1.5;cursor:pointer}
svg.body text{font-size:11px;font-weight:700;fill:#0B0E17;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:560px}
.entry{border-bottom:1px solid var(--line);padding:10px 0}.entry:last-child{border-bottom:0}
.entry .h{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left}
.tag{color:var(--gold);display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--soft)}
.kv{font-size:.92rem;margin:3px 0}.kv b{font-weight:600}
.help{border-color:var(--warn)}.help a,.kv a{color:var(--gold);font-weight:600}.q{font-size:1.25rem;font-weight:700;margin:18px 0 12px;line-height:1.3}.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.av{border-radius:50%;object-fit:cover;background:var(--sel);border:1px solid var(--gold);display:inline-grid;place-items:center;font-family:Georgia,serif;color:var(--ink);flex:none}textarea.one{min-height:46px;height:46px}.kv{white-space:pre-line}label.s{display:block;font-size:.9rem;color:var(--mute);margin:12px 0 4px}
svg.map{display:block;width:100%;max-width:460px;margin:0 auto}svg.map text{fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-weight:600;pointer-events:none}svg.map .n{cursor:pointer;stroke:var(--gold);stroke-width:1.5}svg.map .plus{cursor:pointer}svg.map .plus text{fill:#0B0E17;font-weight:700}svg.map line{stroke:var(--mute);stroke-width:1.6}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}.badge.ok{background:var(--acc)}.badge.fr{background:var(--soft)}.badge.mx{background:var(--gold);color:#0B0E17}.badge.co{background:var(--sel);border-color:var(--warn)}.lib ul{margin:6px 0 4px;padding-left:20px}.lib li{margin:5px 0}.lib h3{margin-top:18px}.note{border-left:3px solid var(--gold);background:var(--card);border-radius:0 10px 10px 0;padding:10px 12px;margin:12px 0;font-size:.93rem}
.banner{background:var(--alert);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.9rem}
</style>
</head>

["drives","Drives and motivations"],["immediate","Immediate goals"],["longTerm","Long term goals"],["plan","How they plan to accomplish these goals"],["affect","How others will be affected"]]],["Past",[["hometown","Hometown"],["childhood","Type of childhood"],["pastPets","Pets (past)"],["firstMemory","First memory"],["keyMemory","Most important childhood memory"],["keyWhy","Why that memory?"],["hero","Childhood hero"],["dreamJob","Dream job"],["education","Education"],["pastReligion","Religion (past)"],["pastFinances","Finances (past)"]]],["Present",[["location","Current location"],["livingWith","Currently living with"],["pets","Pets"],["religion","Religion"],["occupation","Occupation"],["finances","Finances"]]],["Family",[["mother","Mother"],["motherRel","Relationship with her"],["father","Father"],["fatherRel","Relationship with him"],["siblings","Siblings"],["siblingsRel","Relationship with them"],["spouse","Spouse"],["otherFamily","Other important family members"]]],["Favorites",[["color","Color"],["leastColor","Least favorite color"],["music","Music"],["food","Food"],["literature","Literature"],["entertainment","Form of entertainment"],["expressions","Expressions"],["transport","Mode of transportation"],["possession","Most prized possession"]]],["Habits",[["hobbies","Hobbies"],["instrument","Plays a musical instrument?"],["sport","Plays a sport?"],["rainy","How they'd spend a rainy day"],["spending","Spending habits"],["smokes","Smokes"],["drinks","Drinks"],["drugs","Other drugs"],["tooMuch","Does too much of"],["tooLittle","Does too little of"],["skilled","Extremely skilled at"],["unskilled","Extremely unskilled at"],["tics","Nervous tics"],["posture","Usual body posture"],["mannerisms","Mannerisms"],["peculiarities","Peculiarities"]]],["Traits",[["optimist","Optimist or pessimist?"],["introvert","Introvert or extrovert?"],["daredevil","Daredevil or cautious?"],["logical","Logical or emotional?"],["messy","Disorderly and messy, or methodical and neat?"],["work const LIB=[{"t":"Dissociation: the spectrum and five core symptoms","s":"Well established","n":"The five-symptom description comes from structured clinical interviews for dissociative disorders and is widely used by clinicians. Where a person sits on the spectrum can only be assessed by a qualified professional.","b":[{"h":"A spectrum, not an on/off switch","l":["Everyday dissociation: daydreaming, zoning out, driving somewhere and not remembering the trip","Stress and trauma related: checking out under pressure, gaps in memory around hard events","Depersonalization and derealization that keep coming back","Dissociative disorders, including dissociative identity disorder"]},{"h":"The five core symptoms","l":["Amnesia: memory loss, often described as losing time","Depersonalization: feeling disconnected from your own body, mind or self","Derealization: feeling disconnected from the world around you, as if it isn't real","Identity confusion: an inner struggle about who you are","Identity alteration: acting like a different person some of the time"]},{"h":"What depersonalization can feel like","l":["Your body seems foreign or not yours","Watching yourself from outside","Limbs look distorted, larger or smaller","Detached from emotions, robotic"]},{"h":"What derealization can feel like","l":["Surroundings feel unfamiliar","The world looks blurry, flat or colourless","People seem far away, as if behind glass","Sizes, shapes and distances look wrong"]},{"p":"The quick check-in has these as tap lists under \"What it feels like\"."}]},{"t":"What DID feels like","s":"Well established","n":"Dissociative identity disorder is a recognised diagnosis in both major diagnostic manuals. The view that it develops from severe, repeated childhood trauma is the mainstream clinical position. A minority of researchers argue that social and cultural factors play a larger part; that debate is about causes, not about whether people's experiences are real.","b":[{"p":"DID is a trauma-related condition. Instead of one continuous sense of self, distinct identity states (often called alters or parts) develop to hold experiences, emotions or memories that were too much for one child to carry."},{"h":"Dissociation","l":["Feeling disconnected from yourself","Watching your life from the outside","Losing track of time","The world or yourself not feeling real","Checking out during stress"]},{"h":"Memory","l":["Finding things you don't remember buying","Gaps in memory","Forgetting conversations","Losing hours","Other people remembering things you don't"]},{"h":"Identity states","l":["Different parts taking over at different times","Different ways of thinking, speaking or responding","Different memories, emotions or abilities between parts","Internal conversations between parts"]},{"h":"Daily life","l":["Confusion about memory gaps","Difficulty trusting your own memories","Fear about lost time","Constantly piecing the day together","Exhaustion from switching or dissociating"]},{"h":"What it gets mistaken for","l":["Schizophrenia (a different condition, centred on psychosis)","Attention-seeking, dishonesty or manipulation","\"Making it up\" or a vivid imagination"]},{"h":"Worth remembering","l":["It is not a choice and not caused by imagination","Having DID does not make someone dangerous","Parts formed because, at one time, that was the safest way to survive"]}]},{"t":"Types of alters","s":"Useful framework","n":"These are descriptive labels used by clinicians and the DID community, not official diagnostic categories. One alter can fit several labels, change over time, or fit none. Some people find \"persecutor\" unhelpful, since these parts are usually trying to protect in the only way they learned.","b":[{"l":["Core / original: first in the system or body","Host / fronter: handles some or most of daily life","Protector: protects the body, system or other alters","Persecutor: acts against the body or system, usually to keep control or avoid worse harm","Introject: based on an outside person, real, fictional or historical","Memory holder: holds memories, often of trauma, sometimes happy ones","Gatekeeper: controls switching or access to memories and areas inside","Internal self helper: holds knowledge about the system and how it works","Fragment: not fully differentiated; holds a single emotion, memory or job"]},{"h":"Subsystems","p":"A subsystem is a system within a system: an alter who has their own group of parts. The System map shows these as smaller circles."}]},{"t":"CPTSD, OSDD and DID","s":"Mixed: parts contested","n":"The idea of a single line from CPTSD to DID comes from structural dissociation theory. It is influential among trauma clinicians but it is a theory, not settled science, and real people don't sort this neatly. Complex PTSD is an official diagnosis in the international manual (ICD-11) but not in the American one (DSM-5). Treatment goals also vary: some people work toward integration, others toward parts cooperating well. This is not a tool for diagnosis.","b":[{"h":"Complex PTSD","l":["Identity: mostly intact but unstable","Parts of self: none distinct","Memory gaps: rare","Inner experience: intrusive thoughts, flashbacks","Usual treatment focus: trauma processing"]},{"h":"Complex PTSD with dissociation","l":["Identity: fluctuates, feels disconnected","Parts of self: emotional parts, such as an inner child","Memory gaps: sometimes, under stress","Inner experience: numbing, detachment","Usual treatment focus: stabilisation, then trauma work"]},{"h":"OSDD (other specified dissociative disorder)","l":["Identity: some differentiation","Parts of self: some distinct parts, often with less amnesia between them","Memory gaps: partial or situational","Inner experience: inner dialogue, switching","Usual treatment focus: work with the internal system"]},{"h":"DID (dissociative identity disorder)","l":["Identity: clearly defined alters","Parts of self: distinct alters","Memory gaps: frequent","Inner experience: voices, an inner world","Usual treatment focus: long-term, phase-based therapy"]}]},{"t":"Window of tolerance","s":"Useful framework","n":"The window of tolerance is a widely used clinical model for describing arousal states. The version in this app is one adapted for autistic people by a self-care writer. It is a way of describing how you feel, not a test or a diagnosis, and the calming suggestions are common self-regulation ideas rather than treatments.","b":[{"h":"Meltdown (hyperarousal: fight or flight)","l":["Feels: anxious, reactive, restless, irritable, angry, tense, flooded","Signs: shallow breathing, easily startled, racing thoughts, more stimming","To come down: less sensory input, deep breathing, weighted blanket, a quiet or dark space"]},{"h":"Rising","p":"Agitated, anxious, on edge, uncomfortable, but still in control."},{"h":"Comfortable (inside the window)","l":["Feels: present, flexible, engaged, stable, curious, calm","Signs: stress is manageable, able to rest, emotions balanced"]},{"h":"Dropping","p":"Demotivated, tired, uncomfortable, shutting down, but still in control."},{"h":"Shutdown (hypoarousal: freeze)","l":["Feels: heavy, distant, tired, numb, foggy, slow","Signs: wanting to isolate, hard to start tasks, less aware of the body, going non-verbal","To come up: more sensory input, movement, fresh air or sun, upbeat music"]},{"h":"Common stressors","l":["Sensory overload","Unpredictability","Social demands","Overthinking","Unmet needs","Masking"]}]},{"t":"The five stress responses","s":"Mixed: parts contested","n":"Fight, flight and freeze are well researched. \"Fawn\" and \"flop\" are newer terms that come mainly from trauma therapists' writing; many people find them accurate and useful, but they have much less formal research behind them.","b":[{"h":"Fight","l":["Intimidating, dominating, emotional, defensive","Glaring, stand-offs, controlling, yelling, heightened senses, feeling cornered"]},{"h":"Flight","l":["Avoidance, escapism, anxiety, restlessness","Staying busy, distancing, racing mind, can't sit still, always ready to leave"]},{"h":"Freeze","l":["Unaware, slowed, not present, loss of control","Forgetful, overwhelmed, holding breath, procrastinating, spacing out, doom scrolling"]},{"h":"Fawn","l":["Caretaking, submitting, people pleasing, loss of identity","No boundaries, can't say no, avoiding conflict, seeking approval, not knowing your own needs"]},{"h":"Flop","l":["Dissociation, decreased awareness, dropping posture, apathy","Numbness, out of body, memory loss, exhaustion, slowed speech, unresponsive, foggy mind"]}]},{"t":"The feelings wheel","s":"Useful framework","n":"Feelings wheels are a common counselling tool for building emotional vocabulary. Different versions group the words differently; none is the \"correct\" one.","b":[{"p":"Start from a core feeling, then look for a more specific word. Naming a feeling more precisely tends to make it easier to understand and to explain to someone else."},{"h":"How to use it","l":["Pause for a moment","Notice what you are feeling","Find the closest match, starting from the core feeling","All feelings are allowed, including numb and not sure"]},{"p":"The quick check-in uses this wheel for its Emotion question. The picture you saved had several misspelled and misplaced words, which were corrected in the app."}]},{"t":"Cognitive distortions","s":"Well established","n":"Cognitive distortions are a core idea in cognitive behavioural therapy with decades of research. One correction: the chart you saved listed \"black-and-white thinking\" twice under two names, so the tenth here is \"should statements\", which is what its description was pointing at. A caution for trauma survivors: a thought that sounds distorted can be an accurate lesson from a past that really was dangerous. The question is whether it still fits now.","b":[{"h":"1. All-or-nothing thinking","l":["Seeing only two extremes with no middle ground","Sounds like: \"If it isn't perfect, I failed.\"","Try: \"I can do my best, and that counts.\""]},{"h":"2. Catastrophizing","l":["Expecting the worst possible outcome","Sounds like: \"This mistake will ruin everything.\"","Try: \"It's a mistake, not a disaster. I can handle it.\""]},{"h":"3. Mind reading","l":["Assuming you know what others think","Sounds like: \"They didn't reply, so they're angry with me.\"","Try: \"I don't know what they're thinking. I can ask.\""]},{"h":"4. Fortune telling","l":["Predicting a bad outcome without evidence","Sounds like: \"I'll never be good enough.\"","Try: \"I can't see the future. I'll deal with today.\""]},{"h":"5. Overgeneralization","l":["Turning one event into a permanent pattern","Sounds like: \"I failed once, so I always fail.\"","Try: \"One time doesn't define me.\""]},{"h":"6. Labeling","l":["Summing up yourself or someone else in one harsh word","Sounds like: \"I'm such an idiot.\"","Try: \"I made a mistake. That isn't who I am.\""]},{"h":"7. Emotional reasoning","l":["Treating a feeling as proof","Sounds like: \"I feel anxious, so something bad is coming.\"","Try: \"Feelings come and go. I can check the facts.\""]},{"h":"8. Personalization","l":["Taking the blame for things that aren't yours","Sounds like: \"They're in a bad mood because of me.\"","Try: \"It may have nothing to do with me.\""]},{"h":"9. Mental filter","l":["Noticing only the bad parts","Sounds like: \"That one comment ruined the whole day.\"","Try: \"There were good things too.\""]},{"h":"10. Should statements","l":["Rigid rules about how you or others must be","Sounds like: \"They should always agree with me.\"","Try: \"Different opinions are okay.\""]}]},{"t":"Trauma recovery wheel","s":"Useful framework","n":"This is one therapist-made way of organising what recovery can involve. It is a helpful map, not a research-tested model, and recovery doesn't have to follow it in order.","b":[{"h":"Access to safety","p":"A sense of safety in your body, in relationships and in the world.","l":["Developing coping tools and resources","Finding supportive, affirming environments","Connecting in healthy relationships","Finding a sense of ease in your body","Learning skills for nervous system regulation"]},{"h":"Self-trust","p":"Knowing you can handle challenges, meet your needs, stand up for yourself and accept yourself.","l":["Standing up for yourself","Knowing you can handle challenges","Listening to body signals and emotions","Honouring your needs","Accepting who you are"]},{"h":"Healthy relationships","p":"Relationships with mutual caring, trust, boundaries and safety.","l":["Respecting each other","Open communication","Honouring boundaries and seeking consent","Cultivating compassion and kindness","Building trust"]},{"h":"Integrated story","p":"Understanding what happened to you and how it has affected you.","l":["Identifying impactful life events","Establishing a timeline and context","Naming themes from events","Resolving and repairing experiences","Creating meaning in present life"]},{"h":"Life engagement","p":"Taking part in activities that are meaningful, enjoyable and in line with your values.","l":["Choosing meaningful activities","Acting in line with your values","Leisure and play","Balancing rest and self-care","Participating in life management"]},{"h":"Emotion acceptance","p":"Being with all emotions, difficult and comfortable, and supporting yourself through them.","l":["Developing awareness of emotions","Acknowledging all emotions as part of being human","Validating emotions","Offering yourself compassion","Learning distress tolerance skills for overwhelm"]}]},{"t":"EMDR and ART compared","s":"Mixed: parts contested","n":"The two therapies do not have equal evidence. EMDR has been studied for decades and is recommended for PTSD in major treatment guidelines, including the World Health Organization's. ART is newer, with fewer and smaller studies, and its short session counts come largely from its own early research. The chart you saved was prepared by an ART trainer. Also, with DID, trauma-processing therapies of either kind are usually adapted and paced carefully by a clinician experienced in dissociation. This is a question for your treatment team, not something a chart can settle.","b":[{"h":"EMDR (Eye Movement Desensitization and Reprocessing)","l":["An eight-phase protocol for reprocessing traumatic memories","Often described as 6 to 12 sessions, more for complex histories","More client-led, with free association during processing","Usually targets a single worst image with its beliefs, emotions and body sensations","Eye movements vary, and taps or sounds can be used instead","You briefly name the memory; detailed retelling is not required"]},{"h":"ART (Accelerated Resolution Therapy)","l":["Uses guided eye movements plus visualization to change how a memory is experienced","Often described as 1 to 5 sessions","More directive, with the therapist guiding each step","Works through the whole scene rather than one image","A fixed pattern of horizontal eye movements","You do not have to describe the trauma aloud; you replace distressing images with ones you choose"]},{"h":"In common","l":["Both use side-to-side eye movements","Both aim to reduce the distress attached to memories","Fit depends on your readiness, the therapist's training and your overall treatment plan"]}]},{"t":"ADHD, autism and bipolar disorder compared","s":"Mixed: parts contested","n":"This is a simplified side-by-side and several lines overgeneralise: many autistic people do have mood changes and impulsivity, for example. The three often overlap or occur together, and all of them can look like trauma responses and dissociation, and the reverse. \"ADHD burnout\" and \"autistic burnout\" are community terms; autistic burnout has some early research, neither is a formal diagnosis. Not for diagnosing yourself or anyone else.","b":[{"h":"ADHD","l":["Mood: rapid shifts, intense reactivity, irritability","Focus: hard to sustain, easily distracted, hyperfocus on interesting things","Impulsivity: a core feature; acting, interrupting, quick decisions","Regulation: quick to overwhelm or anger, easily discouraged","Social: wants connection, may miss cues","Routines: hard to build and keep; seeks novelty","Energy: variable, restless, bursts and crashes"]},{"h":"Autism","l":["Mood: often steadier; meltdowns and shutdowns come from sensory or other overload","Focus: intense and specialised; hard to shift","Impulsivity: usually lower; behaviour tied more to sensory needs and routines","Regulation: difficulty processing and communicating emotions","Social: lasting difficulty with unwritten rules, body language and tone","Routines: strong need for predictability; distress when they change","Energy: depends on the person and the sensory environment"]},{"h":"Bipolar disorder","l":["Mood: episodes lasting days to weeks; mania (elevated or irritable) and depression","Focus: racing thoughts in mania; slowed thinking in depression","Impulsivity: high during mania, with risk-taking and spending","Regulation: severe, prolonged highs and lows","Social: very talkative in mania; withdrawn in depression","Routines: sleep and eating routines protect stability and get disrupted by episodes","Energy: very high with little need for sleep in mania; exhausted in depression"]}]},{"t":"The \"12 ADHD types\"","s":"Contested","n":"These twelve types are not recognised clinical categories. They come from social media, not from research or diagnostic manuals. Clinically, ADHD has three presentations: predominantly inattentive, predominantly hyperactive-impulsive, and combined. The descriptions below may still feel familiar, and it's fine to use them as everyday language, but they have no diagnostic meaning.","b":[{"l":["Inattentive dreamer: overthinking, forgetfulness, daydreaming","Hyperactive motor: restlessness, fidgeting, impulsive actions","Visionary creative: creativity, hyperfocus, chaos","Disorganized explorer: lost items, time blindness,  else if(a==="save"){const e=Object.assign({id:"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),type:ui.form},D);

  const hasKids=ui.editAlter.id&&mapGroups().S.some(k=>k.parent===ui.editAlter.id),data={name,role:D.role||"",notes:D.notes||"",photo:D.photo||"",profile,parent:D.isSub==="Yes"&&!hasKids?D.parent||"":""};let al=ui.editAlter;if(al.id)Object.assign(al,data);else{al=Object.assign({id:"a"+Date.now().toString(36)},data);mem.alters.push(al);ui.viewAlter=al.id}

 render()});
document.addEventListener("input",ev=>{const ds=ev.target.dataset||{},k=ds.k;if(k&&D)D[k]=ev.target.value;

 if(ev.target.id!=="restore")return;const f=ev.target.files[0];if(!f)return;const r=new FileReader();

   const have=new Set(mem.entries.map(e=>e.id));let added=0;o.entries.forEach(e=>{if(e&&e.id&&!have.has(e.id)){mem.entries.push(e);added++}});mem.entries.sort((a,b)=>a.ts-b.ts);
